[package]
name = "charloom-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
charloom-core.workspace = true
charloom-face-fit = { path = "../charloom-face-fit" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["net", "sync", "rt-multi-thread", "macros", "time", "signal", "fs"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
ureq = { version = "3.5", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
