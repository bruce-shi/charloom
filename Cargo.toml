[workspace]
members = ["crates/charloom-core", "crates/charloom-io", "crates/charloom-engine", "crates/charloom-cli", "crates/charloom-mcp", "crates/charloom-face-fit", "crates/charloom-wasm", "crates/charloom-local", "crates/charloom-mh"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
charloom-core = { path = "crates/charloom-core" }
charloom-io = { path = "crates/charloom-io" }
charloom-engine = { path = "crates/charloom-engine" }
charloom-local = { path = "crates/charloom-local" }
charloom-mh = { path = "crates/charloom-mh" }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
nalgebra = "0.35"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extensions", "extras", "KHR_materials_unlit", "KHR_texture_transform"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
sha2 = "0.10"
ufbx = "=0.11.5"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
tempfile = "3.23"
rmcp = { version = "3.8.0", features = ["transport-io"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Fast optimized binaries for iterative numerical experiments.
[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
